name: Publicar SGO (produção)

# Publica automaticamente para TODOS os usuários sempre que o código entra na
# branch principal (main). Só toca no SGO — nunca na plataforma do CEO (a chave
# de deploy no servidor está travada para rodar apenas o script de deploy do SGO).
on:
  push:
    branches: [main]

# Nunca deixa dois deploys rodando ao mesmo tempo.
concurrency:
  group: deploy-sgo-producao
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Ler a versão do app
        id: v
        run: |
          VER=$(grep -oE "APP_VERSION *= *'[0-9]+\.[0-9]+\.[0-9]+'" src/lib/version.ts | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Versão: v$VER"

      - name: Buildar a imagem (aqui no GitHub, sem pesar no servidor)
        run: |
          DOCKER_BUILDKIT=1 docker build --provenance=false \
            -t sgo-sgo-app:latest \
            -t "sgo-sgo-app:v${{ steps.v.outputs.version }}" .

      - name: Preparar acesso ao servidor
        run: |
          mkdir -p ~/.ssh
          # A chave é guardada em base64 (uma linha) para não corromper na colagem.
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          # valida a chave antes de seguir (erro claro se estiver errada)
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null && echo "chave de deploy OK"

      - name: Publicar no servidor (envia a imagem + migra + sobe + avisa no SGO)
        run: |
          docker save sgo-sgo-app:latest "sgo-sgo-app:v${{ steps.v.outputs.version }}" \
            | gzip \
            | ssh -i ~/.ssh/id_deploy -o ConnectTimeout=30 \
                "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                "deploy ${{ github.actor }} v${{ steps.v.outputs.version }}"

      # E-mail de aviso. Opcional: só dispara se os secrets SMTP estiverem
      # configurados; se não estiverem, o passo é ignorado (não falha o deploy).
      - name: Avisar por e-mail (publicação OK)
        if: success() && env.SMTP_USERNAME != ''
        continue-on-error: true
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.SMTP_PORT || '465' }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: SGO Deploy <${{ secrets.SMTP_USERNAME }}>
          to: ${{ secrets.NOTIFY_EMAIL }}
          subject: "✅ SGO publicado: v${{ steps.v.outputs.version }}"
          body: |
            Nova versão do SGO foi publicada para todos os usuários.

            Versão:        v${{ steps.v.outputs.version }}
            Publicado por: ${{ github.actor }}
            Quando:        ${{ github.event.head_commit.timestamp }}
            Site:          https://sgorestaurantesgbf.com.br

            Detalhes da publicação:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Avisar por e-mail (publicação FALHOU)
        if: failure() && env.SMTP_USERNAME != ''
        continue-on-error: true
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.SMTP_PORT || '465' }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: SGO Deploy <${{ secrets.SMTP_USERNAME }}>
          to: ${{ secrets.NOTIFY_EMAIL }}
          subject: "❌ SGO — deploy FALHOU (v${{ steps.v.outputs.version }})"
          body: |
            Uma publicação do SGO FALHOU e não foi ao ar (ou foi revertida sozinha).

            Versão tentada: v${{ steps.v.outputs.version }}
            Por:            ${{ github.actor }}

            Veja o erro em:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Resumo
        if: always()
        run: echo "Deploy da v${{ steps.v.outputs.version }} concluído (veja o log acima)."
